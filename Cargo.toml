[package]
name = "obsidian-mcp"
version = "0.3.0"
edition = "2021"
description = "Obsidian vault MCP server (help + executeCommand CLI model)"
license = "MIT"

[lib]
name = "obsidian_mcp"
path = "src/lib.rs"

[[bin]]
name = "obsidian-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.16", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
chrono = "0.4"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "0.16", features = ["client", "transport-child-process"] }
