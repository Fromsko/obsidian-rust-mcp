name: 🚀 Release

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: obsidian-mcp

jobs:
  check-version:
    name: 🔍 检测版本变化
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.new }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 检测版本变化
        id: version
        run: |
          OLD=$(git show HEAD^:Cargo.toml | grep '^version' | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          NEW=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          echo "old=$OLD"
          echo "new=$NEW"
          echo "old=$OLD" >> $GITHUB_OUTPUT
          echo "new=$NEW" >> $GITHUB_OUTPUT
          if [ "$OLD" != "$NEW" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: 🔨 构建 ${{ matrix.target }}
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🦀 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 🔧 安装 OpenSSL (macOS x64 交叉编译)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV

      - name: 💾 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: 🔨 构建
        run: cargo build --release --target ${{ matrix.target }}

      - name: 📦 打包
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a ../../../${{ env.BINARY_NAME }}-${{ matrix.target }}.zip ${{ env.BINARY_NAME }}${{ matrix.ext }}
          else
            tar czvf ../../../${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz ${{ env.BINARY_NAME }}${{ matrix.ext }}
          fi

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.target }}.*

  release:
    name: 🚀 发布 Release
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📥 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📋 整理文件
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec mv {} release/ \;
          ls -la release/

      - name: 🏷️ 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body: |
            ## 📦 Obsidian Rust MCP v${{ needs.check-version.outputs.version }}

            基于 Rust 构建的高性能 Obsidian 知识库 MCP 服务器。

            ### 下载

            | 平台 | 架构 | 下载 |
            |------|------|------|
            | Windows | x64 | [obsidian-mcp-x86_64-pc-windows-msvc.zip](https://github.com/${{ github.repository }}/releases/download/v${{ needs.check-version.outputs.version }}/obsidian-mcp-x86_64-pc-windows-msvc.zip) |
            | Linux | x64 | [obsidian-mcp-x86_64-unknown-linux-gnu.tar.gz](https://github.com/${{ github.repository }}/releases/download/v${{ needs.check-version.outputs.version }}/obsidian-mcp-x86_64-unknown-linux-gnu.tar.gz) |
            | macOS | x64 | [obsidian-mcp-x86_64-apple-darwin.tar.gz](https://github.com/${{ github.repository }}/releases/download/v${{ needs.check-version.outputs.version }}/obsidian-mcp-x86_64-apple-darwin.tar.gz) |
            | macOS | ARM64 | [obsidian-mcp-aarch64-apple-darwin.tar.gz](https://github.com/${{ github.repository }}/releases/download/v${{ needs.check-version.outputs.version }}/obsidian-mcp-aarch64-apple-darwin.tar.gz) |

            ### MCP 配置示例

            ```json
            {
              "mcpServers": {
                "obsidian-mcp": {
                  "command": "/path/to/obsidian-mcp",
                  "env": {
                    "OBSIDIAN_VAULT_ROOT": "/path/to/your/vault"
                  }
                }
              }
            }
            ```

            ### 提供的工具

            - `note_index_tree` - 获取完整文件树和标签索引
            - `query_note` - 搜索笔记（支持标签、文件名、关键词）
            - `read_note` - 读取笔记完整内容
            - `write_note` - 创建或更新笔记（支持追加/覆盖模式）
            - `delete_note` - 删除笔记
            - `write_note_tips` - 查看写入规范文档
          files: release/*
          draft: false
          prerelease: false
